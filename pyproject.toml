[project]
name = "model-drift"
version = "0.4.5"
description = "Detección de deriva de comportamiento en LLMs: mide si los prompts de un producto siguen comportándose igual cuando cambia el modelo o su configuración de ejecución."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "jsonschema>=4.22.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
model-drift = "model_drift.cli:main"

# Sin esta lista setuptools intenta auto-descubrir paquetes y falla porque la
# raíz tiene varios directorios candidatos (docs, suites, state...).
[tool.setuptools.packages.find]
include = ["model_drift", "model_drift.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["model_drift"]
# Las pruebas de `main()` lanzan un proceso nuevo a proposito (una sola raiz
# de Tcl por proceso, como en produccion). Sin medir los subprocesos, `main()`
# apareceria sin cubrir solo por ejecutarse fuera de pytest.
parallel = true

[tool.coverage.report]
show_missing = true
# Umbral mínimo: el CI falla si la cobertura total cae por debajo. Se deja un
# punto por debajo de lo medido (93,3 %) porque el bootstrap y las simulaciones
# de potencia recorren un número distinto de ramas entre pasadas. Se sube a
# medida que avanzan las fases; nunca se baja para dejar pasar una entrega.
fail_under = 92

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "docs", "state"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # `class X(str, Enum)` en vez de `StrEnum`: es la forma que usan el Broker y
    # el Knowledge_Orchestrator, y el espejo del contrato (broker_contracts.py)
    # tiene que poder copiarse entre proyectos sin traducir enumeraciones.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
files = ["model_drift"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
